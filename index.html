
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jubilee Gospel Centre International | City of Increase</title>

    <!-- Automatic Redirect -->
    <meta http-equiv="refresh" content="3; url=/PAGES/index.html">

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jubilee Gospel Centre International | City of Increase">
    <meta property="og:description" content="Influencing the world with the Word. Impossibility does not exist here.">
    <meta property="og:url" content="https://jgci.gideonesienss.workers.dev/">
    <meta property="og:image" content="https://jgci.gideonesienss.workers.dev/IMAGES/jubileeLogo.png">
    <meta property="og:image:alt" content="Jubilee Gospel Centre International logo">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #173F91;
            color: #ffffff;
            font-family: 'Montserrat', Arial, sans-serif;
            text-align: center;
            padding: 25px;
        }

        .welcome-screen {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: fadeIn 1s ease;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(1.3rem, 5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.3;
        }

        h2 {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 4px;
        }

        .divider {
            width: 65px;
            height: 3px;
            background: #ffffff;
            border-radius: 10px;
            margin: 8px 0;
        }

        .slogan {
            font-size: 1rem;
            line-height: 1.6;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 18px;
        }

        .loading p {
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #ffffff55;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .logo {
                width: 105px;
                height: 105px;
            }

            h2 {
                font-size: 0.85rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>
    <main class="welcome-screen">

        <img
            src="/IMAGES/jubileeLogo.png"
            alt="Jubilee Gospel Centre International Logo"
            class="logo"
        >

        <h1>JUBILEE GOSPEL CENTRE INTERNATIONAL</h1>

        <h2>CITY OF INCREASE</h2>

        <div class="divider"></div>

        <p class="slogan">
            Influencing the world with the Word.
        </p>

        <div class="loading">
            <p>Preparing your experience...</p>
            <div class="spinner"></div>
        </div>

    </main>
</body>
</html>
